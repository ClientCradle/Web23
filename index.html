<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash
      // of the wrong theme. Kept in sync with ThemeToggle.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("web23-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>Web23 — Smart Domains, Tokenized for the Future</title>
    <meta
      name="description"
      content="Web23 is a secure DNS platform for all of your domains & profiles, tokenized on-chain. Register, mint and manage Web2 and Web3 domains in one dashboard."
    />
    <meta property="og:title" content="Web23 — Smart Domains, Tokenized for the Future" />
    <meta property="og:description" content="Connect Web2 and Web3 identities through decentralized smart domains." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
